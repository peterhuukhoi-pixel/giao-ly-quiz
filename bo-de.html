<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đề giáo lý bổ sung</title><style>body{font-family:system-ui,sans-serif;background:#eef4f1;color:#173b32;margin:0}header{background:#145e55;color:white;padding:18px}main{max-width:950px;margin:20px auto;padding:0 16px}.panel{background:white;padding:18px;margin:14px 0;border-radius:12px;border:1px solid #dce7e1}button,select,input{padding:10px;border:1px solid #adc8ba;border-radius:8px;font:inherit}button{cursor:pointer;background:#145e55;color:white}button:disabled{opacity:.4}.opts label{display:block;padding:9px;margin:6px 0;background:#f1f5f2;border-radius:8px}small{color:#59766d}.warn{color:#9a5b10}.muted{color:#667}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}select{max-width:100%}</style></head><body><header><b>GIÁO LÝ QUIZ · BỘ ĐỀ BỔ SUNG</b></header><main><p><a href="./index.html">← Trở về trang chính</a></p><div class="panel"><h2>Ôn tập theo tài liệu gốc</h2><p class="warn">Các câu trích xuất tự động từ tài liệu, chưa được kiểm tra toàn bộ; đáp án chưa xác minh sẽ không chấm điểm. Có thể có câu hoặc lựa chọn bị tách sai định dạng.</p><div class="row"><select id="source"></select><input id="filter" placeholder="Tìm câu hỏi hoặc nguồn"><button onclick="render()">Tìm</button></div><p id="count"></p></div><div id="items"></div><div class="row"><button id="more" onclick="showMore()">Xem thêm câu hỏi</button></div></main><script>let all=[],view=[],pos=0;const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('./bo-de-cau-hoi.json').then(r=>r.json()).then(d=>{all=d;let sets=[...new Set(d.map(q=>q.source))].sort((a,b)=>a.localeCompare(b,'vi'));$('source').innerHTML='<option value="">Tất cả tài liệu</option>'+sets.map(s=>'<option value="'+esc(s)+'">'+esc(s)+'</option>').join('');render()}).catch(e=>{$('count').textContent='Không tải được dữ liệu: '+e.message});function render(){let src=$('source').value,term=$('filter').value.toLocaleLowerCase('vi');view=all.filter(q=>(!src||q.source===src)&&(!term||(q.q+' '+q.source).toLocaleLowerCase('vi').includes(term)));pos=0;$('items').innerHTML='';$('count').textContent=view.length.toLocaleString('vi-VN')+' câu trích xuất';showMore()}function showMore(){let batch=view.slice(pos,pos+30);$('items').insertAdjacentHTML('beforeend',batch.map((q,i)=>'<article class="panel"><small>Câu '+esc(q.number)+' · '+esc(q.source)+'</small><h3>'+esc(q.q)+'</h3><div class="opts">'+q.options.map((v,j)=>'<label><input type="radio" name="q'+(pos+i)+'"> '+String.fromCharCode(65+j)+'. '+esc(v)+'</label>').join('')+'</div><small class="warn">Đáp án: chưa xác minh · Nguồn gốc: '+esc(q.archive)+'</small></article>').join(''));pos+=batch.length;$('more').disabled=pos>=view.length;$('more').textContent=pos>=view.length?'Đã hiển thị hết':'Xem thêm câu hỏi ('+pos+'/'+view.length+')'}</script></body></html>
