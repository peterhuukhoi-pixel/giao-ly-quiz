 value="all">Tất cả chủ đề</option>${choices(topics())}</select><label>Thứ tự</label><select id="order"><option value="random">Trộn câu hỏi</option><option value="original">Theo thứ tự đề gốc</option></select><label>Loại câu hỏi</label><select id="filter"><option value="all">Tất cả câu hỏi</option><option value="checked">Có đáp án đối chiếu</option><option value="saved">Câu đã đánh dấu</option><option value="wrong">Câu từng trả lời sai</option></select><label>Số câu</label><select id="num"><option>10</option><option>20</option><option>50</option><option>100</option></select><button class="btn wide" style="margin-top:18px" onclick="startStudy()">Bắt đầu</button></div><p class="note">Chỉ hiển thị các câu có đáp án đã được đối chiếu bước đầu từ tài liệu.</p>`)}function startStudy(){let set=$('#set').value,filter=$('#filter').value,topic=$('#topic').value,n=+$('#num').value;let items=bank.filter(q=>(set==='all'||q.set===set)&&(topic==='all'||q.topic===topic)&&(filter==='all'||filter==='checked'&&checked(q)||filter==='pending'&&!checked(q)||filter==='saved'&&bookmarks.includes(q.id)||filter==='wrong'&&wrongIds.includes(q.id)));if($('#order').value==='random')shuffle(items);if(!items.length)return alert('Không có câu hỏi phù hợp.');session={type:'study',items:items.slice(0,n),index:0,answers:{}};question()}function examSetup(){stop();nav('exam');let setnames=[...new Set(bank.filter(checked).map(q=>q.set))];show(`<h2>Thi thử Đại Chủng viện</h2><div class="card"><label>Phạm vi thi</label><select id="set"><option value="all">Tổng hợp các chủ đề</option>${choices(setnames)}</select><label>Chủ đề</label><select id="topic"><option value="all">Tất cả chủ đề</option>${choices(topics())}</select><label>Số câu hỏi</label><select id="num"><option>10</option><option>20</option><option>50</option><option>100</option></select><label>Thời gian</label><select id="minutes"><option value="10">10 phút</option><option value="20">20 phút</option><option value="60" selected>60 phút</option></select><button class="btn wide" style="margin-top:18px" onclick="startExam()">Bắt đầu thi thử</button></div><p class="note">Chỉ sử dụng ${countChecked()} câu đã có đáp án. Đáp án từ tệp đáp án chưa được thẩm định độc lập về mặt thần học; một số bộ đề chưa đủ 100 câu để thi nguyên bản.</p>`)}function startExam(){let set=$('#set').value,topic=$('#topic').value,n=+$('#num').value,mins=+$('#minutes').value;let items=shuffle(bank.filter(q=>checked(q)&&(set==='all'||q.set===set)&&(topic==='all'||q.topic===topic))).slice(0,n);if(!items.length)return alert('Bộ đề này chưa có câu hỏi được đối chiếu đáp án.');session={type:'exam',items,index:0,answers:{},seconds:mins*60,finished:false};clock=setInterval(()=>{if(!session||session.finished)return;session.seconds--;let t=$('#time');if(t)t.textContent='⏱ '+formatTime(session.seconds);if(session.seconds<=0)finish()},1000);question()}function formatTime(s){return Math.floor(Math.max(s,0)/60)+':'+String(Math.max(0,s)%60).padStart(2,'0')}function refLink(src){if(!src||src.startsWith('Tài liệu gốc')||src.startsWith('Đáp án trong tệp'))return '';return 'https://www.google.com/search?q='+encodeURIComponent('site:vatican.va OR site:ktcgkpv.org '+src)}function explanation(q){return `<div class="answer">${status(q)}${checked(q)?`<p><b>Đáp án: ${'ABCDE'[q.answer]}. ${esc(q.options[q.answer])}</b></p><p>${esc(q.explain)}</p>${q.verification==='answer_document_bold'?'<p class="small muted">Nguồn: phương án in đậm trong tài liệu đáp án do người học cung cấp; chưa kiểm chứng độc lập với Kinh Thánh hoặc Giáo lý Hội Thánh.</p>':q.verification==='editorial_reference'?'<p class="small muted">Câu hỏi biên soạn bổ sung, có dẫn nguồn để tự đối chiếu; không trích nguyên văn từ bộ đề đã gửi.</p>':''}<div class="small"><b>Tham chiếu:</b> ${esc(q.source)}</div>${(q.verification==='editorial_reference'&&q.source.includes('https://')?q.source.match(/https:\/\/[^\s;]+/)?.[0]:refLink(q.source))?`<a href="${q.verification==='editorial_reference'&&q.source.includes('https://')?q.source.match(/https:\/\/[^\s;]+/)?.[0]:refLink(q.source)}" target="_blank" rel="noopener noreferrer">Tra cứu tài liệu tham khảo ↗</a>`:''}`:`<p>Chưa có đáp án và giải thích đã được xác minh. Câu này chỉ dùng để tự học, không dùng để chấm điểm.</p><div class="small">${esc(q.source)}</div>`}</div>`}function question(){let s=session;if(!s)return home();let i=s.index,q=s.items[i],picked=s.answers[i];show(`<div class="row" style="margin-top:20px"><span class="tag">${s.type==='exam'?'Thi thử':'Học hỏi'}</span><b id="time">${s.type==='exam'?'⏱ '+formatTime(s.seconds):'Không giới hạn giờ'}</b></div><div class="progress"><div style="width:${100*(i+1)/s.items.length}%"></div></div><div class="row"><span class="muted small">Câu ${i+1} / ${s.items.length}</span><button class="btn alt" style="padding:8px 12px" onclick="bookmark()">${bookmarks.includes(q.id)?'★ Đã lưu':'☆ Lưu câu'}</button></div><div class="card"><div class="small muted">${esc(q.set)} · Câu gốc ${q.number}</div><h3 class="question">${esc(q.q)}</h3>${q.options.map((o,j)=>`<button class="option ${picked===j?'active':''} ${s.type==='study'&&picked!==undefined&&checked(q)&&j===q.answer?'correct':''} ${s.type==='study'&&picked===j&&checked(q)&&j!==q.answer?'wrong':''}" onclick="pick(${j})">${'ABCDE'[j]}. ${esc(o)}</button>`).join('')}${s.type==='study'&&picked!==undefined?explanation(q):''}</div><div class="row"><button class="btn alt" ${i===0?'disabled':''} onclick="move(-1)">← Trước</button>${i===s.items.length-1?`<button class="btn" onclick="finish()">${s.type==='exam'?'Nộp bài':'Hoàn thành'}</button>`:`<button class="btn" onclick="move(1)">Tiếp →</button>`}</div><p class="small muted">Đã trả lời ${Object.keys(s.answers).length}/${s.items.length} câu</p>`)}function pick(j){session.answers[session.index]=j;question()}function move(d){session.index=Math.max(0,Math.min(session.items.length-1,session.index+d));question()}function bookmark(){let id=session.items[session.index].id;bookmarks=bookmarks.includes(id)?bookmarks.filter(x=>x!==id):[...bookmarks,id];save('glq_bookmarks_v3',bookmarks);question()}function finish(){if(!session||session.finished)return;stop();let s=session;s.finished=true;let scored=s.items.filter(checked),correct=scored.filter(q=>s.answers[s.items.indexOf(q)]===q.answer).length;let wrong=scored.filter(q=>s.answers[s.items.indexOf(q)]!==q.answer).map(q=>q.id);wrongIds=[...new Set([...wrongIds,...wrong])];save('glq_wrong_v4',wrongIds);history.unshift({date:new Date().toLocaleString('vi-VN'),type:s.type,total:scored.length,correct,answered:Object.keys(s.answers).length,questions:s.items.length});save('glq_history_v3',history.slice(0,150));nav('progress');show(`<h2>${s.type==='exam'?'Kết quả thi thử':'Hoàn thành buổi học'}</h2><div class="card">${s.type==='exam'?`<div class="score">${correct}/${scored.length}</div><p style="text-align:center">${Math.round(correct/scored.length*100)||0}% câu đúng</p>`:`<div class="score">${Object.keys(s.answers).length}/${s.items.length}</div><p style="text-align:center">Số câu đã thực hành</p>`}<button class="btn wide" onclick="review()">Xem đáp án, giải thích và nguồn</button>${wrong.length?`<button class="btn alt wide" style="margin-top:9px" onclick="reviewWrongCurrent()">Ôn ngay ${wrong.length} câu sai hoặc bỏ trống</button>`:``}</div><button class="btn alt wide" onclick="home()">Về trang chủ</button>`)}function reviewWrongCurrent(){if(!session)return;let s=session,items=s.items.filter(q=>checked(q)&&s.answers[s.items.indexOf(q)]!==q.answer);if(!items.length)return review();session={type:'study',items,index:0,answers:{}};question()}function review(){if(!session)return home();let s=session;show(`<h2>Xem lại bài làm</h2><p class="muted small">Đáp án trích từ tệp đáp án cần được phân biệt với đáp án đã kiểm chứng độc lập.</p>${s.items.map((q,i)=>`<div class="card"><span class="tag">Câu ${i+1}</span><h3>${esc(q.q)}</h3><p class="small">Bạn chọn: <b>${s.answers[i]===undefined?'Chưa trả lời':'ABCDE'[s.answers[i]]+'. '+esc(q.options[s.answers[i]])}</b></p>${explanation(q)}</div>`).join('')}<button class="btn wide" onclick="home()">Hoàn thành</button>`)}function library(){stop();nav('study');let grouped={};bank.forEach(q=>{let v=grouped[q.set]??={n:0,checked:0};v.n++;if(checked(q))v.checked++});show(`<h2>Kho đề gốc</h2><p class="muted">${Object.keys(grouped).length} bộ đề và nhóm tài liệu</p><input id="search" placeholder="Tìm tên bộ đề…" oninput="filterLibrary()"><div id="sets">${Object.entries(grouped).map(([name,v])=>`<div class="card list" data-name="${esc(name.toLowerCase())}"><div><b>${esc(name)}</b><p class="small muted">${v.n} câu · ${v.checked} câu có đáp án</p></div><button class="btn alt" onclick="openSetByIndex(${Object.keys(grouped).indexOf(name)})">Xem</button></div>`).join('')}</div>`)}function filterLibrary(){let t=$('#search').value.toLowerCase();document.querySelectorAll('[data-name]').forEach(e=>e.style.display=e.dataset.name.includes(t)?'':'none')}function openSetByIndex(i){let name=[...new Set(bank.map(q=>q.set))][i];openSet(name)}function openSet(name){let items=bank.filter(q=>q.set===name);session={type:'study',items,index:0,answers:{}};question()}function progress(){stop();nav('progress');show(`<h2>Tiến độ học tập</h2><div class="grid"><div class="card"><div class="count">${history.length}</div><span class="small muted">Buổi học và thi</span></div><div class="card"><div class="count">${bookmarks.length}</div><span class="small muted">Câu đã lưu</span></div></div><div class="card"><h3>Ôn tập thông minh</h3><p class="small muted">${wrongIds.length} câu đã trả lời sai hoặc bỏ trống trong các buổi luyện tập.</p><button class="btn alt wide" onclick="openWrong()" ${!wrongIds.length?'disabled':''}>Ôn câu sai</button><button class="btn alt wide" style="margin-top:8px" onclick="clearWrong()" ${!wrongIds.length?'disabled':''}>Xóa danh sách câu sai đã lưu</button></div><div class="card"><h3>Ôn lại câu đã lưu</h3><button class="btn alt wide" onclick="openSaved()" ${!bookmarks.length?'disabled':''}>Mở sổ tay ôn tập</button></div><h3>Lịch sử gần đây</h3>${history.length?history.slice(0,30).map(h=>`<div class="card row"><div><b>${h.type==='exam'?'Thi thử':'Học hỏi'}</b><div class="small muted">${esc(h.date)}</div></div><b>${h.type==='exam'?h.correct+'/'+h.total:h.answered+'/'+h.questions}</b></div>`).join(''):'<div class="card muted">Chưa có kết quả nào.</div>'}<div class="card"><h3>Nhập thêm câu hỏi</h3><p class="small muted">Nhập tệp JSON theo mẫu. Chỉ nhập câu có trường answer (chỉ số đáp án bắt đầu từ 0). Câu thiếu đáp án sẽ bị bỏ qua.</p><input type="file" id="upload" accept=".json"><button class="btn alt wide" style="margin-top:12px" onclick="importJson()">Nhập JSON</button><button class="btn alt wide" style="margin-top:9px" onclick="exportData()">Xuất kết quả và câu đã lưu</button></div>`)}function openWrong(){let items=bank.filter(q=>wrongIds.includes(q.id));if(!items.length)return progress();session={type:'study',items:shuffle(items),index:0,answers:{}};question()}function clearWrong(){if(!confirm('Xóa danh sách câu sai? Lịch sử điểm vẫn được giữ.'))return;wrongIds=[];save('glq_wrong_v4',wrongIds);progress()}function openSaved(){let items=bank.filter(q=>bookmarks.includes(q.id));if(!items.length)return progress();session={type:'study',items,index:0,answers:{}};question()}function searchPage(){stop();nav('study');show(`<h2>Tìm kiếm câu hỏi</h2><div class="card"><label>Từ khóa</label><input id="qsearch" placeholder="Ví dụ: Áp-ra-ham, Bí tích, Công đồng…" oninput="runSearch()"><label>Chủ đề</label><select id="qtopic" onchange="runSearch()"><option value="all">Tất cả chủ đề</option>${choices(topics())}</select><label>Trạng thái</label><select id="qstatus" onchange="runSearch()"><option value="all">Tất cả câu có đáp án</option></select></div><div id="results" class="card"><p class="muted">Nhập ít nhất 2 ký tự để tìm trong ${bank.length} câu.</p></div>`)}function runSearch(){let q=$('#qsearch').value.trim().toLocaleLowerCase('vi'),topic=$('#qtopic').value,st=$('#qstatus').value,box=$('#results');if(q.length<2){box.innerHTML='<p class="muted">Nhập ít nhất 2 ký tự.</p>';return}let found=bank.filter(x=>(topic==='all'||x.topic===topic)&&(st==='all'||st==='checked'&&checked(x)||st==='pending'&&!checked(x))&&[x.q,...x.options,x.set].join(' ').toLocaleLowerCase('vi').includes(q));box.innerHTML=`<b>${found.length} kết quả</b>${found.slice(0,80).map(x=>`<div class="search-result"><div class="small muted">${esc(x.set)} · Câu ${x.number}</div><p><b>${esc(x.q)}</b></p>${status(x)} <button class="btn alt" style="margin-top:8px" onclick="openQuestionId('${esc(x.id)}')">Học câu này →</button></div>`).join('')}${found.length>80?'<p class="note">Hiển thị 80 kết quả đầu. Hãy nhập từ khóa cụ thể hơn.</p>':''}`};function openQuestionId(id){let q=bank.find(x=>x.id===id);if(!q)return;session={type:'study',items:[q],index:0,answers:{}};question()}function importJson(){let f=$('#upload').files[0];if(!f)return alert('Chọn tệp JSON trước.');f.text().then(t=>{let arr=JSON.parse(t);if(!Array.isArray(arr))throw Error('Cần mảng JSON');let incoming=arr.filter(q=>q.q&&Array.isArray(q.options)&&q.options.length>=2&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<q.options.length).map((q,i)=>({id:'custom'+Date.now()+i,set:q.set||'Đề nhập thêm',number:i+1,q:q.q,options:q.options,topic:q.topic||'Khác',answer:q.answer,status:'checked',source:'Tệp nhập: '+f.name+' (đáp án do người nhập cung cấp; chưa kiểm chứng độc lập)',explain:q.explain||'Đáp án do người nhập cung cấp; chưa kiểm chứng độc lập'}));custom.push(...incoming);bank=[...RAW,...custom];save('glq_custom_v3',custom);alert('Đã thêm '+incoming.length+' câu có đáp án vào ứng dụng.');progress()}).catch(e=>alert('Không đọc được tệp: '+e.message))}function exportData(){let blob=new Blob([JSON.stringify({version:4,exportedAt:new Date().toISOString(),history,bookmarks,wrongIds,custom},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='giao_ly_quiz_tien_do.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}home();</script><script>if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{});}</script></body></html>
