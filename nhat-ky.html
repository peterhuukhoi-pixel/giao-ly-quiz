<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nhật ký riêng tư · Giáo Lý Quiz</title><style>body{font:16px/1.6 system-ui,sans-serif;background:#f5f7fb;color:#18212f;margin:0}main{max-width:760px;margin:30px auto;padding:18px}article{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:22px;margin:18px 0}input,textarea,button{font:inherit}input,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px}textarea{min-height:220px;resize:vertical}button{padding:10px 16px;border:0;border-radius:9px;background:#166534;color:white;cursor:pointer;margin:5px 5px 5px 0}button.secondary{background:#475569}button.danger{background:#b91c1c}button:disabled{opacity:.5}#entries button{font-size:14px}small{color:#64748b}label{display:block;margin:14px 0 6px;font-weight:600}#editor,#listPanel{display:none}h1{color:#166534}</style></head><body><main><a href="./index.html">← Trở về GIÁO LÝ QUIZ</a><h1>Nhật ký mỗi ngày</h1><p>Nhật ký gắn với tài khoản Google. Bạn cần đăng nhập để đọc, viết và sửa. Nội dung lưu trong Firestore theo mã tài khoản; quyền riêng tư phụ thuộc vào quy tắc bảo mật Firestore của dự án.</p><article><p id="status">Đang khởi tạo…</p><button id="login" disabled>Đăng nhập bằng Google</button><button id="logout" class="secondary" style="display:none">Đăng xuất</button></article><article id="editor"><h2>Viết nhật ký</h2><label for="day">Ngày</label><input id="day" type="date"><label for="title">Tiêu đề</label><input id="title" maxlength="160" placeholder="Một ngày đáng nhớ…"><label for="content">Nội dung riêng tư</label><textarea id="content" placeholder="Hôm nay tôi đã…"></textarea><p><button id="save">Lưu nhật ký</button><button id="delete" class="danger">Xóa ngày này</button></p><small id="saveStatus"></small></article><article id="listPanel"><h2>Những ngày đã viết</h2><div id="entries"></div></article></main><script src="./firebase-config.js"></script><script type="module">
const $=id=>document.getElementById(id), status=$('status');let auth,db,user=null,unsubscribe=null;const day=$('day');day.value=new Date().toLocaleDateString('en-CA');const cache=new Map();let loading=false;
const escape=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function clear(){cache.clear();$('title').value='';$('content').value='';$('entries').replaceChildren();$('editor').style.display='none';$('listPanel').style.display='none';$('saveStatus').textContent='';}
try{
 const [{initializeApp,getApps,getApp},{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut},{getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot,query,orderBy}] = await Promise.all([
 import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js')]);
 const app=getApps().length?getApp():initializeApp(window.GLQ_FIREBASE_CONFIG);auth=getAuth(app);db=getFirestore(app);
 $('login').disabled=false;$('login').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){status.textContent='Lỗi đăng nhập: '+e.message}};
 $('logout').onclick=()=>signOut(auth);
 function showDay(){const d=cache.get(day.value);$('title').value=d?.title||'';$('content').value=d?.content||'';$('saveStatus').textContent=d?'Đã lưu trên tài khoản':'Chưa có nhật ký cho ngày này';}
 day.addEventListener('change',showDay);
 $('save').onclick=async()=>{if(!user||loading)return;const selected=day.value;if(!/^\d{4}-\d{2}-\d{2}$/.test(selected))return;loading=true;$('save').disabled=true;$('saveStatus').textContent='Đang lưu…';try{await setDoc(doc(db,'users',user.uid,'journal',selected),{date:selected,title:$('title').value.trim(),content:$('content').value,updatedAt:new Date().toISOString()});$('saveStatus').textContent='✓ Đã lưu'}catch(e){$('saveStatus').textContent='Không thể lưu: '+e.message}finally{loading=false;$('save').disabled=false}};
 $('delete').onclick=async()=>{if(!user||!cache.has(day.value)||!confirm('Xóa vĩnh viễn nhật ký ngày này?'))return;try{await deleteDoc(doc(db,'users',user.uid,'journal',day.value));$('title').value='';$('content').value='';$('saveStatus').textContent='Đã xóa'}catch(e){$('saveStatus').textContent='Không thể xóa: '+e.message}};
 onAuthStateChanged(auth,u=>{if(unsubscribe){unsubscribe();unsubscribe=null;}user=u;clear();$('login').style.display=u?'none':'inline-block';$('logout').style.display=u?'inline-block':'none';if(!u){status.textContent='Bạn chưa đăng nhập. Nội dung nhật ký không hiển thị.';return}status.textContent='Đang tải nhật ký của '+(u.email||'tài khoản Google');$('editor').style.display='block';$('listPanel').style.display='block';const uid=u.uid;unsubscribe=onSnapshot(query(collection(db,'users',uid,'journal'),orderBy('date','desc')),snapshot=>{if(!user||user.uid!==uid)return;cache.clear();snapshot.forEach(s=>cache.set(s.id,s.data()));const box=$('entries');box.replaceChildren();for(const [date,entry] of cache){const b=document.createElement('button');b.className='secondary';b.textContent=date+' · '+(entry.title||'Không tiêu đề');b.onclick=()=>{day.value=date;showDay();window.scrollTo({top:0,behavior:'smooth'})};box.append(b)}if(!cache.size)box.textContent='Chưa có nhật ký nào.';showDay();status.textContent='✓ Nhật ký của '+(user.email||'bạn')},e=>{status.textContent='Không thể đọc nhật ký: '+e.message+' — cần kiểm tra quyền Firestore.'})});
}catch(e){status.textContent='Không thể khởi tạo Firebase: '+e.message}
</script></body></html>
